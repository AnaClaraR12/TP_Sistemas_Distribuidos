name: E2E (sistema completo em Docker Compose)

# Sobe os 23 contêineres reais (Postgres, Redis, RabbitMQ, MailHog, 6 serviços, workers,
# gateway e frontend), popula pela API e verifica cada requisito do enunciado via gateway.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # só o compose base: o override de dev fixa portas por serviço e impediria o --scale
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pytest

      - name: Preparar .env e chaves JWT
        run: |
          cp .env.example .env
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path(".env"); s = p.read_text()
          ajustes = {
              "THROTTLE_ANON": "100000/min", "THROTTLE_LOGIN": "1000/min",
              "GATEWAY_RATE_LOGIN": "100r/s", "GATEWAY_BURST_LOGIN": "200",
              "GATEWAY_RATE_REPOSITORIO": "2000r/s", "GATEWAY_BURST_REPOSITORIO": "4000",
              "EXTERNO_RATE_LIMIT_POR_MIN": "1000", "GUNICORN_WORKERS": "2",
          }
          for k, v in ajustes.items():
              s = re.sub(rf"^{k}=.*$", f"{k}={v}", s, flags=re.M) if re.search(rf"^{k}=", s, re.M) else s + f"\n{k}={v}\n"
          p.write_text(s)
          PY
          sh scripts/generate_jwt_keys.sh

      - name: Build das imagens
        run: docker compose build --parallel

      - name: Subir o sistema
        run: docker compose up -d --wait --wait-timeout 900

      - name: Estado dos contêineres
        if: always()
        run: docker compose ps -a

      - name: Seed de demonstração (pela API)
        run: python scripts/seed_demo.py --gateway http://localhost:8080

      - name: Testes ponta a ponta e verificação dos requisitos
        run: pytest tests/e2e -v -rs --tb=short -p no:cacheprovider

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 > compose-logs.txt || true
          for s in auth-service monografias-service bancas-service repositorio-service notificacoes-service relatorios-service gateway \
                   monografias-worker repositorio-worker bancas-worker notificacoes-worker auth-worker; do
            echo "===== $s ====="; docker compose logs --no-color --tail=60 $s | grep -viE '"nivel": "INFO"' | tail -40
          done
      - name: Anexar logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
