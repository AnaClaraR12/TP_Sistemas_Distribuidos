{% load i18n %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block head_title %}Sistema de Monografias{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #1f2933; margin: 0; }
    main { max-width: 420px; margin: 8vh auto; background: #fff; padding: 2rem; border-radius: 10px;
           box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin-top: 0; }
    input { width: 100%; padding: .55rem; margin: .25rem 0 .9rem; border: 1px solid #cbd2d9; border-radius: 6px; box-sizing: border-box; }
    button { background: #1d4ed8; color: #fff; border: 0; padding: .6rem 1.2rem; border-radius: 6px; cursor: pointer; }
    .errorlist { color: #b91c1c; padding-left: 1rem; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
<main>
  <p><strong>Sistema Distribuído de Monografias</strong></p>
  {% if messages %}<ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block body %}{% block content %}{% endblock %}{% endblock %}
  <p style="margin-top:2rem;font-size:.85rem"><a href="/">Voltar ao sistema</a></p>
</main>
</body>
</html>
