# Configuração de qualidade compartilhada (ruff + black) do monorepo.
[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*", ".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = [
    "S101",   # assert em testes
    "S105", "S106",  # senhas de teste/demo
    "B008",
    "DJ001",  # null=True em CharField (local/link opcionais)
    "E501",
    "DJ008",  # read models simples sem __str__
    "DJ012",  # ordem de métodos (estilo)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "DJ"]
"**/settings/*.py" = ["F403", "F405", "F821"]  # globals().update(construir(...))
"scripts/*.py" = ["S311", "S603", "S607", "B023"]  # aguardar() executa o lambda na mesma iteração
"loadtest/*.py" = ["S311", "S603", "S607", "S113"]
"tests/e2e/*.py" = ["S", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["tcc_common", "apps", "config"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/run_consumer.py"]
