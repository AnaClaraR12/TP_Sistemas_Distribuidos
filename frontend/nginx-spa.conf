server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;  # rotas do React Router
        add_header Cache-Control "no-cache";
    }
}
