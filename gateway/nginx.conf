# API Gateway / reverse proxy / borda do Sistema Distribuído de Monografias.
# O server block fica em templates/default.conf.template (envsubst de limites).
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # X-Request-ID: preserva o do cliente se vier; senão gera
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id","ip":"$remote_addr",'
                                '"metodo":"$request_method","uri":"$request_uri","status":$status,'
                                '"bytes":$body_bytes_sent,"tempo":$request_time,"upstream":"$upstream_addr",'
                                '"upstream_tempo":"$upstream_response_time","cache":"$upstream_cache_status"}';
    access_log /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    client_max_body_size 1m;  # padrão; rotas de upload liberam 55m

    # DNS interno do Docker: permite `--scale` (upstreams com "resolve")
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
