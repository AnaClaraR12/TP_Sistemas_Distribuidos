[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-common"
version = "1.0.0"
description = "Biblioteca compartilhada pelos microsserviços do Sistema Distribuído de Monografias"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "django-environ>=0.12",
    "django-redis>=6.0",
    "django-simple-history>=3.8",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "PyJWT[crypto]>=2.10",
    "pika>=1.3",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "django-cors-headers>=4.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-cov>=6", "fakeredis>=2.26"]

[tool.setuptools.packages.find]
include = ["tcc_common*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.txt"]
